
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta
    name="description"
    content="不限價位，分享我在埔里吃過、喜歡，也想推薦的店。"
  >

  <title>埔里日常食記</title>

  <link rel="stylesheet" href="./assets/css/style.css">

  <!-- 先載入店家資料，再載入網站功能 -->
  <script src="./assets/js/restaurants.js" defer></script>
  <script src="./assets/js/app.js" defer></script>
</head>

<body>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#">埔里日常食記</a>
      <span class="header-note">我的埔里生活口袋名單</span>
    </div>
  </header>

  <main class="container">

    <!-- 首頁 -->
    <section id="home-view" aria-labelledby="home-title">

      <div class="hero">
        <p class="eyebrow">住在埔里，記錄日常的好味道</p>

        <h1 id="home-title">今天，在埔里吃什麼？</h1>

        <p class="intro">
          不限價位，也不做美食排名。
          這裡記錄我親自吃過、喜歡，也想分享給你的店。
        </p>
      </div>

      <!-- 搜尋區域 -->
      <div class="search-panel">

        <label for="search">
          找店家，也找想吃的餐點
        </label>

        <input
          id="search"
          type="search"
          placeholder="例如：黃切仔、燉飯、拉麵、早餐"
          autocomplete="off"
        >

        <p class="search-hint">
          可以輸入店名、餐點或食物類別。
        </p>

      </div>

      <!-- 搜尋結果 -->
      <div class="list-heading">

        <h2>我的推薦名單</h2>

        <p id="result-count" role="status">
          正在載入店家資料...
        </p>

      </div>

      <div id="restaurant-list" class="card-grid"></div>

      <!-- 網站說明 -->
      <aside class="site-notice">

        <h2>關於這份食記</h2>

        <p>
          內容是我的個人用餐感受，口味喜好僅供參考。
          消費金額為約略紀錄，實際價格、營業資訊及活動，
          請以店家最新公告為準。
        </p>

      </aside>

    </section>

    <!-- 個別食記 -->
    <section
      id="detail-view"
      aria-labelledby="detail-title"
      hidden
    ></section>

  </main>

  <footer class="container site-footer">
    <p>
      埔里日常食記｜把喜歡的店，慢慢收進生活裡。
    </p>
  </footer>

</body>
</html>
